trigger:
  branches:
    include:
      - main

pool:
  name: Default

variables:
  QUAY_NAMESPACE: afiyamulla
  FRONTEND_IMAGE: quay.io/afiyamulla/studentapp
  BACKEND_IMAGE: quay.io/afiyamulla/studentapi
  OPENSHIFT_NAMESPACE: 3tier

steps:
  - checkout: self
    displayName: Checkout Source Code

  - task: UseDotNet@2
    displayName: Install .NET 8 SDK
    inputs:
      packageType: sdk
      version: 8.0.x

  - task: NodeTool@0
    displayName: Install Node.js 22
    inputs:
      versionSpec: 22.x

  - script: |
      set -eu
      echo "===== VERIFY BUILD TOOLS ====="
      git --version
      dotnet --version
      node --version
      npm --version
      docker --version
      docker info
    displayName: Verify Build Environment

  - script: |
      set -eu
      API_DIR="$(Build.SourcesDirectory)/StudentAPI/StudentAPI/StudentAPI"
      PROJECT="$API_DIR/StudentAPI.csproj"

      echo "===== RESTORE .NET DEPENDENCIES ====="
      dotnet restore "$PROJECT"

      echo "===== BUILD .NET API ====="
      dotnet build "$PROJECT" --configuration Release --no-restore

      echo "===== .NET BUILD SUCCESSFUL ====="
    displayName: Build StudentAPI

  - script: |
      set -eu
      FRONTEND_DIR="$(Build.SourcesDirectory)/student-app"

      echo "===== INSTALL ANGULAR DEPENDENCIES ====="
      cd "$FRONTEND_DIR"
      npm ci

      echo "===== BUILD ANGULAR FRONTEND ====="
      npm run build

      echo "===== ANGULAR BUILD SUCCESSFUL ====="
    displayName: Build StudentApp

  - task: Docker@2
    displayName: Build and Push Angular Image to Quay.io
    inputs:
      command: buildAndPush
      containerRegistry: QuaySC
      repository: afiyamulla/studentapp
      Dockerfile: $(Build.SourcesDirectory)/student-app/Dockerfile
      buildContext: $(Build.SourcesDirectory)/student-app
      tags: |
        $(Build.BuildId)

  - task: Docker@2
    displayName: Build and Push .NET API Image to Quay.io
    inputs:
      command: buildAndPush
      containerRegistry: QuaySC
      repository: afiyamulla/studentapi
      Dockerfile: $(Build.SourcesDirectory)/StudentAPI/StudentAPI/StudentAPI/Dockerfile
      buildContext: $(Build.SourcesDirectory)/StudentAPI/StudentAPI/StudentAPI
      tags: |
        $(Build.BuildId)

  - task: SSH@0
    displayName: Deploy Images to Existing OpenShift Deployments
    inputs:
      sshEndpoint: OpenShifSC
      runOptions: commands
      readyTimeout: 20000
      commands: |
        set -eu

        echo "===== CHECK OPENSHIFT LOGIN ====="
        oc whoami

        echo "===== CHECK PROJECT ====="
        oc get project 3tier
        oc project 3tier

        echo "===== VERIFY EXISTING DEPLOYMENTS ====="
        oc get deployment studentapp studentapi -n 3tier

        echo "===== UPDATE FRONTEND IMAGE ====="
        oc set image deployment/studentapp studentapp=quay.io/afiyamulla/studentapp:$(Build.BuildId) -n 3tier

        echo "===== UPDATE BACKEND IMAGE ====="
        oc set image deployment/studentapi studentapi=quay.io/afiyamulla/studentapi:$(Build.BuildId) -n 3tier

        echo "===== WAIT FOR FRONTEND ROLLOUT ====="
        oc rollout status deployment/studentapp -n 3tier --timeout=180s

        echo "===== WAIT FOR BACKEND ROLLOUT ====="
        oc rollout status deployment/studentapi -n 3tier --timeout=180s

        echo "===== VERIFY DEPLOYMENTS AND PODS ====="
        oc get deployments,pods,svc,routes -n 3tier

        echo "===== VERIFY DEPLOYED IMAGES ====="
        oc get deployment studentapp studentapi -n 3tier -o custom-columns=NAME:.metadata.name,IMAGE:.spec.template.spec.containers[*].image

        echo "===== DEPLOYMENT COMPLETED ====="