# ============================================================
# Azure DevOps CI/CD Pipeline - EduAdmin
# Angular Frontend + .NET 8 API -> Quay.io -> OpenShift CRC
# Agent Pool: OpenShiftSA
# Service connections: QuaySC, OpenShiftSC
# ============================================================

trigger:
  branches:
    include:
      - main

pr: none

pool:
  name: OpenShiftSA

variables:
  frontendPath: 'student-app'
  backendPath: 'StudentAPI/StudentAPI/StudentAPI'
  buildConfiguration: 'Release'
  frontendImage: 'quay.io/afiyamulla/studentapp'
  apiImage: 'quay.io/afiyamulla/studentapi'
  openshiftProject: 'eduadmin-dev'
  remoteManifestPath: '/tmp/eduadmin-openshift/$(Build.BuildId)'

stages:
# ============================================================
# STAGE 1: VALIDATE REPOSITORY AND AGENT
# ============================================================
- stage: Validate
  displayName: 'Validate Source and Agent'
  jobs:
  - job: ValidateSource
    displayName: 'Validate Repository and Tools'
    steps:
    - checkout: self
      clean: true

    - bash: |
        set -euo pipefail

        echo "Checking tools..."
        git --version
        docker --version
        node --version
        npm --version
        dotnet --version

        echo "Checking source files..."
        test -f "$(Build.SourcesDirectory)/$(frontendPath)/package.json"
        test -f "$(Build.SourcesDirectory)/$(frontendPath)/Dockerfile"
        test -f "$(Build.SourcesDirectory)/$(backendPath)/StudentAPI.csproj"
        test -f "$(Build.SourcesDirectory)/$(backendPath)/Dockerfile"

        echo "Checking OpenShift manifests..."
        test -f "$(Build.SourcesDirectory)/openshift/bootstrap/namespace.yaml"
        test -f "$(Build.SourcesDirectory)/openshift/app/kustomization.yaml"
        test -f "$(Build.SourcesDirectory)/openshift/app/configmap.yaml"
        test -f "$(Build.SourcesDirectory)/openshift/app/frontend-deployment.yaml"
        test -f "$(Build.SourcesDirectory)/openshift/app/api-deployment.yaml"

        echo "Validation passed."
      displayName: 'Validate Tools and Repository Structure'

# ============================================================
# STAGE 2: BUILD AND TEST
# ============================================================
- stage: Build
  displayName: 'Build and Test Applications'
  dependsOn: Validate
  jobs:
  - job: BuildAngular
    displayName: 'Build Angular Frontend'
    steps:
    - checkout: self
    - bash: |
        set -euo pipefail
        cd "$(Build.SourcesDirectory)/$(frontendPath)"
        npm ci
        npm run build
      displayName: 'Install Dependencies and Build Angular'

  - job: BuildDotNet
    displayName: 'Build and Test .NET API'
    steps:
    - checkout: self
    - bash: |
        set -euo pipefail
        cd "$(Build.SourcesDirectory)/$(backendPath)"
        dotnet restore StudentAPI.csproj
        dotnet build StudentAPI.csproj \
          --configuration "$(buildConfiguration)" \
          --no-restore
        dotnet test StudentAPI.csproj \
          --configuration "$(buildConfiguration)" \
          --no-build
      displayName: 'Restore, Build and Test .NET API'

# ============================================================
# STAGE 3: BUILD AND PUSH CONTAINER IMAGES
# ============================================================
- stage: DockerBuildAndPush
  displayName: 'Build and Push Images to Quay'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: BuildAndPushImages
    displayName: 'Build and Push Frontend and API'
    steps:
    - checkout: self
      clean: true

    - task: Docker@2
      displayName: 'Login to Quay.io'
      inputs:
        command: login
        containerRegistry: 'QuaySC'

    - bash: |
        set -euo pipefail
        FRONTEND_IMAGE="$(frontendImage):$(Build.BuildId)"
        docker build --pull \
          --tag "$FRONTEND_IMAGE" \
          "$(Build.SourcesDirectory)/$(frontendPath)"
        docker push "$FRONTEND_IMAGE"
        echo "Frontend image pushed: $FRONTEND_IMAGE"
      displayName: 'Build and Push Angular Image'

    - bash: |
        set -euo pipefail
        API_IMAGE="$(apiImage):$(Build.BuildId)"
        docker build --pull \
          --tag "$API_IMAGE" \
          "$(Build.SourcesDirectory)/$(backendPath)"
        docker push "$API_IMAGE"
        echo "API image pushed: $API_IMAGE"
      displayName: 'Build and Push .NET API Image'

    - bash: |
        docker logout quay.io || true
      displayName: 'Logout from Quay.io'
      condition: always()

# ============================================================
# STAGE 4: DEPLOY TO OPENSHIFT CRC
# ============================================================
- stage: OpenShiftDeploy
  displayName: 'Deploy to OpenShift CRC'
  dependsOn: DockerBuildAndPush
  condition: succeeded()
  jobs:
  - job: Deploy
    displayName: 'Deploy manifests using Kustomize'
    steps:
    - checkout: self
      clean: true

    # Copy the complete openshift directory to the CRC server.
    - task: CopyFilesOverSSH@0
      displayName: 'Copy OpenShift Manifests to CRC Server'
      inputs:
        sshEndpoint: 'OpenShifSC'
        sourceFolder: '$(Build.SourcesDirectory)/openshift'
        contents: '**'
        targetFolder: '$(remoteManifestPath)'
        cleanTargetFolder: true
        overwrite: true

    # SSH task executes commands on the CRC server.
    - task: SSH@0
      displayName: 'Apply Project and Deploy with Kustomize'
      inputs:
        sshEndpoint: 'OpenShifSC'
        runOptions: 'inline'
        inline: |
          set -eu

          echo "Checking OpenShift login..."
          oc whoami
          oc whoami --show-server

          echo "Creating/updating OpenShift project..."
          oc apply -f "$(remoteManifestPath)/bootstrap/namespace.yaml"

          echo "Checking required API secret..."
          if ! oc -n "$(openshiftProject)" get secret studentapi-secret >/dev/null 2>&1; then
            echo "ERROR: Secret studentapi-secret is missing in project $(openshiftProject)."
            echo "Create it securely before deployment. Do not commit credentials to Git."
            exit 1
          fi

          echo "Setting image tags for this build..."
          sed -i "s/__IMAGE_TAG__/$(Build.BuildId)/g" "$(remoteManifestPath)/app/kustomization.yaml"

          echo "Applying all app resources through Kustomize..."
          oc apply -k "$(remoteManifestPath)/app/" -n "$(openshiftProject)"

          echo "Waiting for frontend rollout..."
          oc rollout status deployment/studentapp \
            -n "$(openshiftProject)" --timeout=180s

          echo "Waiting for API rollout..."
          oc rollout status deployment/studentapi \
            -n "$(openshiftProject)" --timeout=180s

          echo "Final deployment status:"
          oc get deployments,pods,services,routes \
            -n "$(openshiftProject)"
