
# Trigger pipeline when changes are pushed to the main branch
trigger:
  branches:
    include:
      - main

# Disable automatic pull-request pipeline runs for now
pr: none

# Use the existing Azure DevOps self-hosted agent pool
pool:
  name: OpenShiftSA

# Centralized configuration for reusable paths
variables:
  # Relative path of the Angular frontend from the repository root
  - name: frontendPath
    value: 'student-app'

  # Relative path of the .NET API from the repository root
  - name: backendPath
    value: 'StudentAPI/StudentAPI/StudentAPI'

  # Configuration used by the .NET build
  - name: buildConfiguration
    value: 'Release'

# Define pipeline stages
stages:
  - stage: Validate
    displayName: 'Validate Source Code'

    jobs:
      - job: ValidateSource
        displayName: 'Validate Repository and Tools'

        steps:
          # Download the repository onto the agent
          - checkout: self
            clean: true

          # Verify required tools and application paths
          - bash: |
              set -euo pipefail

              git --version
              docker --version
              node --version
              npm --version
              dotnet --version

              # Build.SourcesDirectory is predefined by Azure DevOps
              echo "Repository root: $(Build.SourcesDirectory)"

              # Validate frontend files
              test -f "$(Build.SourcesDirectory)/$(frontendPath)/package.json"
              test -f "$(Build.SourcesDirectory)/$(frontendPath)/Dockerfile"

              # Validate backend files
              test -f "$(Build.SourcesDirectory)/$(backendPath)/StudentAPI.csproj"
              test -f "$(Build.SourcesDirectory)/$(backendPath)/Dockerfile"

              echo "Repository validation successful."
            displayName: 'Check tools and application paths'

  - stage: Build
    displayName: 'Build and Test Applications'
    dependsOn: Validate

    jobs:
      # Build the Angular frontend
      - job: BuildAngular
        displayName: 'Build Angular Frontend'

        steps:
          - checkout: self

          - bash: |
              set -euo pipefail

              # Move to the frontend directory
              cd "$(Build.SourcesDirectory)/$(frontendPath)"

              # Install dependencies from the lock file
              npm ci

              # Build the Angular application
              npm run build
            displayName: 'Install dependencies and build Angular'

      # Build and test the .NET API
      - job: BuildDotNet
        displayName: 'Build .NET API'

        steps:
          - checkout: self

          - bash: |
              set -euo pipefail

              # Move to the backend directory
              cd "$(Build.SourcesDirectory)/$(backendPath)"

              # Restore NuGet dependencies
              dotnet restore StudentAPI.csproj

              # Compile the application in Release configuration
              dotnet build StudentAPI.csproj \
                --configuration "$(buildConfiguration)" \
                --no-restore

              # Run tests available in this project
              dotnet test StudentAPI.csproj \
                --configuration "$(buildConfiguration)" \
                --no-build
            displayName: 'Restore, build and test .NET API'
