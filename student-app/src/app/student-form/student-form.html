<div class="card shadow border-0 mb-4">

    <div class="card-header bg-primary text-white">
        <h5 class="mb-0">
            <i class="bi bi-person-plus-fill"></i>
            Add Student
        </h5>
    </div>

    <div class="card-body">

        <form
            [formGroup]="studentForm"
            (ngSubmit)="onSubmit()">

            <div class="row g-4">

                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        placeholder="Enter Student Name"
                        formControlName="name">

                </div>

                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Email
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        placeholder="Enter Email"
                        formControlName="email">

                </div>

                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Course
                    </label>

                    <select
                        class="form-select"
                        formControlName="course">

                        <option value="">Select Course</option>
                        <option>Angular</option>
                        <option>.NET</option>
                        <option>Java</option>
                        <option>Python</option>
                        <option>React</option>

                    </select>

                </div>

                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Age
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        placeholder="Enter Age"
                        formControlName="age">

                </div>

            </div>

            <div class="text-center mt-4">

                <button
                    type="submit"
                    class="btn btn-success btn-lg px-5">

                   Add Student

                </button>

            </div>

        </form>

    </div>

</div>
