apiVersion: apps/v1
kind: Deployment

metadata:
  name: studentapi
  namespace: student

spec:
  replicas: 2

  selector:
    matchLabels:
      app: studentapi

  template:
    metadata:
      labels:
        app: studentapi

    spec:
      containers:
      - name: studentapi

        image: reenaso16/studentapi:v1
        imagePullPolicy: Always

        ports:
        - containerPort: 5000

        env:

        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: student-config
              key: ASPNETCORE_ENVIRONMENT

        - name: DB_SERVER
          valueFrom:
            configMapKeyRef:
              name: student-config
              key: DB_SERVER

        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: student-config
              key: DB_PORT

        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: student-config
              key: DB_NAME

        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: student-secret
              key: DB_USER

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: student-secret
              key: DB_PASSWORD

        - name: ASPNETCORE_URLS
          value: "http://+:5000"

        - name: ConnectionStrings__DefaultConnection
          value: "Server=$(DB_SERVER),$(DB_PORT);Database=$(DB_NAME);User Id=$(DB_USER);Password=$(DB_PASSWORD);TrustServerCertificate=True;Encrypt=False;"
