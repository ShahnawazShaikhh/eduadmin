# ============================================================
# STAGE 3: BUILD AND PUSH DOCKER IMAGES
# ============================================================
- stage: Docker
  displayName: 'Docker Build and Push'
  # dependsOn removed because 'Build' stage is commented out
  jobs:
  - job: BuildPush
    displayName: 'Build and Push Frontend and API'
    steps:
    - checkout: self
      fetchDepth: 1
      clean: false
    - task: Docker@2
      displayName: 'Login to Quay.io'
      inputs:
        command: login
        containerRegistry: 'QuaySC'
    - bash: |
        set -euo pipefail
        FRONTEND_IMAGE="$(frontendImage):$(Build.BuildId)"
        API_IMAGE="$(apiImage):$(Build.BuildId)"
        echo "========== Build Docker Images =========="
        docker build --pull \
          -t "$FRONTEND_IMAGE" \
          "$(Build.SourcesDirectory)/$(frontendPath)" &
        PID1=$!
        docker build --pull \
          -t "$API_IMAGE" \
          "$(Build.SourcesDirectory)/$(backendPath)" &
        PID2=$!
        # Check both build exit statuses
        BUILD1=0
        BUILD2=0
        wait "$PID1" || BUILD1=$?
        wait "$PID2" || BUILD2=$?
        if [ "$BUILD1" -ne 0 ] || [ "$BUILD2" -ne 0 ]; then
          echo "ERROR: One or both Docker builds failed."
          exit 1
        fi
        echo "========== Push Docker Images =========="
        docker push "$FRONTEND_IMAGE" &
        PID3=$!
        docker push "$API_IMAGE" &
        PID4=$!
        # Check both push exit statuses
        PUSH1=0
        PUSH2=0
        wait "$PID3" || PUSH1=$?
        wait "$PID4" || PUSH2=$?
        if [ "$PUSH1" -ne 0 ] || [ "$PUSH2" -ne 0 ]; then
          echo "ERROR: One or both Docker pushes failed."
          exit 1
        fi
        echo "========== Images Published =========="
        echo "Frontend: $FRONTEND_IMAGE"
        echo "API:      $API_IMAGE"
      displayName: 'Build and Push Both Images in Parallel'
    - bash: |
        docker logout quay.io || true
      displayName: 'Logout from Quay.io'
      condition: always()

# ============================================================
# STAGE 4: DEPLOY TO OPENSHIFT
# ============================================================
- stage: Deploy
  displayName: 'Deploy to OpenShift'
  dependsOn: Docker
  condition: succeeded()
  jobs:
  - job: Deploy
    displayName: 'Apply Manifests and Verify Rollout'
    steps:
    - checkout: self
      fetchDepth: 1
      clean: false
    # --------------------------------------------------------
    # Copy OpenShift manifests to CRC server
    # --------------------------------------------------------
    - task: CopyFilesOverSSH@0
      displayName: 'Copy OpenShift Manifests'
      inputs:
        sshEndpoint: 'OpenShifSC'
        sourceFolder: '$(Build.SourcesDirectory)/openshift'
        contents: |
          bootstrap/**
          app/**
        targetFolder: '/tmp/eduadmin-$(Build.BuildId)'
        cleanTargetFolder: true
        overwrite: true
    # --------------------------------------------------------
    # Apply manifests and verify deployment
    # --------------------------------------------------------
    - task: SSH@0
      displayName: 'Deploy and Verify OpenShift Applications'
      inputs:
        sshEndpoint: 'OpenShifSC'
        runOptions: 'inline'
        inline: |
          set -euo pipefail
          PROJECT="$(openshiftProject)"
          MANIFEST="/tmp/eduadmin-$(Build.BuildId)"
          # Cleanup temporary manifests when the script exits
          trap 'rm -rf "$MANIFEST"' EXIT
          echo "========== OpenShift Login Check =========="
          oc whoami
          oc whoami --show-server
          echo "========== Create or Update Project =========="
          # Safely create or update project without triggering immutable field errors
          if ! oc get project "$PROJECT" >/dev/null 2>&1; then
            oc apply -f "$MANIFEST/bootstrap/namespace.yaml"
          else
            echo "Project $PROJECT already exists. Ensuring annotations/labels or skipping immutable create."
          fi
          echo "========== Validate Required Secret =========="
          if ! oc get secret studentapi-secret \
            -n "$PROJECT" >/dev/null 2>&1; then
            echo "ERROR: Secret studentapi-secret does not exist in $PROJECT."
            echo "Create the database Secret before deploying."
            exit 1
          fi
          echo "Required Secret exists."
          echo "========== Update Image Tag =========="
          sed -i \
            "s/__IMAGE_TAG__/$(Build.BuildId)/g" \
            "$MANIFEST/app/kustomization.yaml"
          echo "Image tag: $(Build.BuildId)"
          echo "========== Apply Kustomize Manifests =========="
          oc apply -k "$MANIFEST/app/" -n "$PROJECT"
          echo "========== Wait for Frontend Rollout =========="
          oc rollout status deployment/studentapp \
            -n "$PROJECT" \
            --timeout=180s
          echo "========== Wait for API Rollout =========="
          oc rollout status deployment/studentapi \
            -n "$PROJECT" \
            --timeout=180s
          echo "========== Final Deployment Status =========="
          oc get deployments,pods,services,routes \
            -n "$PROJECT"
          echo "========== Deployment Completed Successfully =========="