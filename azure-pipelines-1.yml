# ============================================================
# Azure DevOps CI Pipeline - Afiya
# Application: Angular Frontend + .NET 8 API
# Container Registry: Quay.io
# Agent Pool: OpenShiftSA
# ============================================================

# Trigger pipeline when changes are pushed to main
trigger:
  branches:
    include:
      - main

# Disable automatic pull-request runs for now
pr: none

# Use the existing self-hosted agent pool
pool:
  name: OpenShiftSA

# ============================================================
# PIPELINE VARIABLES
# ============================================================
variables:
  # Angular frontend directory relative to repository root
  - name: frontendPath
    value: 'student-app'

  # .NET API directory relative to repository root
  - name: backendPath
    value: 'StudentAPI/StudentAPI/StudentAPI'

  # Build configuration
  - name: buildConfiguration
    value: 'Release'

  # Quay.io image repositories
  - name: frontendImage
    value: 'quay.io/afiyamulla/studentapp'

  - name: apiImage
    value: 'quay.io/afiyamulla/studentapi'

# ============================================================
# STAGE 1: VALIDATE SOURCE CODE AND AGENT
# ============================================================
stages:
  - stage: Validate
    displayName: 'Validate Source Code'
    jobs:
      - job: ValidateSource
        displayName: 'Validate Repository and Tools'
        steps:
          # Checkout source code
          - checkout: self
            clean: true

          # Verify required tools and source files
          - bash: |
              set -euo pipefail

              echo "Checking installed tools..."
              git --version
              docker --version
              node --version
              npm --version
              dotnet --version

              echo "Repository root: $(Build.SourcesDirectory)"

              echo "Checking Angular files..."
              test -f "$(Build.SourcesDirectory)/$(frontendPath)/package.json"
              test -f "$(Build.SourcesDirectory)/$(frontendPath)/Dockerfile"

              echo "Checking .NET API files..."
              test -f "$(Build.SourcesDirectory)/$(backendPath)/StudentAPI.csproj"
              test -f "$(Build.SourcesDirectory)/$(backendPath)/Dockerfile"

              echo "Source validation successful."
            displayName: 'Verify Agent and Repository Structure'

  # ============================================================
  # STAGE 2: BUILD AND TEST APPLICATIONS
  # ============================================================
  - stage: Build
    displayName: 'Build and Test Applications'
    dependsOn: Validate

    jobs:
      # ------------------------------------------------------
      # Job 1: Build Angular frontend
      # ------------------------------------------------------
      - job: BuildAngular
        displayName: 'Build Angular Frontend'
        steps:
          - checkout: self

          - bash: |
              set -euo pipefail

              cd "$(Build.SourcesDirectory)/$(frontendPath)"

              echo "Installing Angular dependencies..."
              npm ci

              echo "Building Angular application..."
              npm run build

              echo "Angular build successful."
            displayName: 'Install Dependencies and Build Angular'

      # ------------------------------------------------------
      # Job 2: Build and test .NET API
      # ------------------------------------------------------
      - job: BuildDotNet
        displayName: 'Build .NET API'
        steps:
          - checkout: self

          - bash: |
              set -euo pipefail

              cd "$(Build.SourcesDirectory)/$(backendPath)"

              echo "Restoring NuGet packages..."
              dotnet restore StudentAPI.csproj

              echo "Building .NET API..."
              dotnet build StudentAPI.csproj \
                --configuration "$(buildConfiguration)" \
                --no-restore

              echo "Running configured tests..."
              dotnet test StudentAPI.csproj \
                --configuration "$(buildConfiguration)" \
                --no-build

              echo ".NET build and test successful."
            displayName: 'Restore, Build and Test .NET API'

  # ============================================================
  # STAGE 3: BUILD DOCKER IMAGES AND PUSH TO QUAY.IO
  # ============================================================
  - stage: DockerBuildAndPush
    displayName: 'Build and Push Docker Images'
    dependsOn: Build
    condition: succeeded()

    jobs:
      - job: BuildAndPushImages
        displayName: 'Build and Push Frontend and API Images'
        steps:
          # Checkout source code
          - checkout: self
            clean: true

          # --------------------------------------------------
          # Authenticate using existing QuaySC service connection
          # --------------------------------------------------
          - task: Docker@2
            displayName: 'Login to Quay.io'
            inputs:
              command: login
              containerRegistry: 'QuaySC'

          # --------------------------------------------------
          # Build Angular frontend Docker image
          # --------------------------------------------------
          - bash: |
              set -euo pipefail

              FRONTEND_IMAGE="$(frontendImage):$(Build.BuildId)"

              echo "Building frontend image..."

              docker build \
                --pull \
                --tag "$FRONTEND_IMAGE" \
                "$(Build.SourcesDirectory)/$(frontendPath)"

              echo "Frontend image built successfully."
              echo "Image: $FRONTEND_IMAGE"
            displayName: 'Build Angular Docker Image'

          # --------------------------------------------------
          # Build .NET API Docker image
          # --------------------------------------------------
          - bash: |
              set -euo pipefail

              API_IMAGE="$(apiImage):$(Build.BuildId)"

              echo "Building API image..."

              docker build \
                --pull \
                --tag "$API_IMAGE" \
                "$(Build.SourcesDirectory)/$(backendPath)"

              echo ".NET API image built successfully."
              echo "Image: $API_IMAGE"
            displayName: 'Build .NET API Docker Image'

          # --------------------------------------------------
          # Push Angular and API images to Quay.io
          # --------------------------------------------------
          - bash: |
              set -euo pipefail

              FRONTEND_IMAGE="$(frontendImage):$(Build.BuildId)"
              API_IMAGE="$(apiImage):$(Build.BuildId)"

              echo "Pushing Angular image..."
              docker push "$FRONTEND_IMAGE"

              echo "Pushing .NET API image..."
              docker push "$API_IMAGE"

              echo "Both images pushed successfully."
            displayName: 'Push Docker Images to Quay.io'

          # --------------------------------------------------
          # Remove registry authentication after the push
          # --------------------------------------------------
          - bash: |
              docker logout quay.io || true
            displayName: 'Logout from Quay.io'
            condition: always()

  - stage: OpenShiftConnectionTest
    displayName: Test OpenShift Server Connection
    dependsOn: DockerBuildAndPush
    condition: succeeded()
    jobs:
      - job: SSHTest
        steps:
          - task: SSH@0
            displayName: Connect to OpenShift CRC Server
            inputs:
              sshEndpoint: 'OpenShifSC'
              runOptions: 'inline' # ← change this too
              inline: |
                set -euo pipefail
                hostname
                whoami
                oc whoami --show-server || true
                crc status || true

  - stage: OpenShiftDeploy
    displayName: Deploy to OpenShift
    dependsOn: OpenShiftConnectionTest # recommended
    condition: succeeded()
    jobs:
          - job: CreateProject
            displayName: Create OpenShift Project
            steps:
              - task: SSH@0
                displayName: Create eduadmin-dev Project
                inputs:
                  sshEndpoint: 'OpenShifSC'
                  runOptions: 'inline' # ← MUST be inline
                  inline: |
                    set -euo pipefail

                    if oc get project eduadmin-dev >/dev/null 2>&1; then
                      echo "Project eduadmin-dev already exists"
                    else
                      echo "Creating project eduadmin-dev..."
                      oc new-project eduadmin-dev
                    fi

                    oc project eduadmin-dev
                    echo "Current project is: $(oc project -q)"
