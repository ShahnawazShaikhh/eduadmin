
# ============================================================
# Azure DevOps CI/CD Pipeline - EduAdmin (Optimized)
# ============================================================
trigger:
  branches:
    include:
      - main
pr: none

pool:
  name: OpenShiftSA

variables:
  frontendPath: 'student-app'
  backendPath: 'StudentAPI/StudentAPI/StudentAPI'
  buildConfiguration: 'Release'
  frontendImage: 'quay.io/afiyamulla/studentapp'
  apiImage: 'quay.io/afiyamulla/studentapi'
  openshiftProject: 'eduadmin-dev'
  # Cache keys
  npmCacheKey: 'npm | "$(Agent.OS)" | student-app/package-lock.json'
  nugetCacheKey: 'nuget | "$(Agent.OS)" | **/packages.lock.json'

stages:

# ------------------------------------------------------------
# STAGE 1: VALIDATE (lightweight)
# ------------------------------------------------------------
- stage: Validate
  displayName: 'Validate'
  jobs:
  - job: Validate
    displayName: 'Validate Source & Tools'
    steps:
    - checkout: self
      clean: false                    # clean hata diya
      fetchDepth: 1                   # shallow clone = faster

    - bash: |
        set -euo pipefail
        echo "Tools check..."
        docker --version
        node --version
        npm --version
        dotnet --version
        oc version --client || true

        echo "Source check..."
        test -f "$(Build.SourcesDirectory)/$(frontendPath)/package.json"
        test -f "$(Build.SourcesDirectory)/$(frontendPath)/Dockerfile"
        test -f "$(Build.SourcesDirectory)/$(backendPath)/StudentAPI.csproj"
        test -f "$(Build.SourcesDirectory)/$(backendPath)/Dockerfile"
        test -f "$(Build.SourcesDirectory)/openshift/app/kustomization.yaml"
        echo "Validation passed."
      displayName: 'Quick Validate'

# ------------------------------------------------------------
# STAGE 2: BUILD + TEST (Parallel + Cache)
# ------------------------------------------------------------
- stage: Build
  displayName: 'Build & Test'
  dependsOn: Validate
  jobs:

  # ---------- Angular ----------
  - job: BuildAngular
    displayName: 'Angular'
    steps:
    - checkout: self
      fetchDepth: 1

    - task: Cache@2
      displayName: 'Cache npm'
      inputs:
        key: '$(npmCacheKey)'
        restoreKeys: |
          npm | "$(Agent.OS)"
        path: $(Pipeline.Workspace)/.npm

    - bash: |
        set -euo pipefail
        cd "$(Build.SourcesDirectory)/$(frontendPath)"
        npm ci --cache $(Pipeline.Workspace)/.npm --prefer-offline
        npm run build
      displayName: 'npm ci + build'

  # ---------- .NET ----------
  - job: BuildDotNet
    displayName: '.NET API'
    steps:
    - checkout: self
      fetchDepth: 1

    - task: Cache@2
      displayName: 'Cache NuGet'
      inputs:
        key: '$(nugetCacheKey)'
        restoreKeys: |
          nuget | "$(Agent.OS)"
        path: $(Pipeline.Workspace)/.nuget

    - bash: |
        set -euo pipefail
        cd "$(Build.SourcesDirectory)/$(backendPath)"
        export NUGET_PACKAGES=$(Pipeline.Workspace)/.nuget
        dotnet restore StudentAPI.csproj --packages $NUGET_PACKAGES
        dotnet build StudentAPI.csproj -c $(buildConfiguration) --no-restore
        dotnet test  StudentAPI.csproj -c $(buildConfiguration) --no-build --verbosity minimal
      displayName: 'Restore + Build + Test'

# ------------------------------------------------------------
# STAGE 3: DOCKER BUILD + PUSH (Parallel images)
# ------------------------------------------------------------
- stage: Docker
  displayName: 'Docker Build & Push'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: BuildPush
    displayName: 'Build & Push Images'
    steps:
    - checkout: self
      fetchDepth: 1
      clean: false

    - task: Docker@2
      displayName: 'Login Quay.io'
      inputs:
        command: login
        containerRegistry: 'QuaySC'

    # Build both images in parallel using background processes
    - bash: |
        set -euo pipefail

        FRONTEND_IMAGE="$(frontendImage):$(Build.BuildId)"
        API_IMAGE="$(apiImage):$(Build.BuildId)"

        echo "Building Frontend & API images in parallel..."

        # Frontend build in background
        docker build --pull -t "$FRONTEND_IMAGE" \
          "$(Build.SourcesDirectory)/$(frontendPath)" &
        PID1=$!

        # API build in background
        docker build --pull -t "$API_IMAGE" \
          "$(Build.SourcesDirectory)/$(backendPath)" &
        PID2=$!

        # Wait for both
        wait $PID1
        wait $PID2

        echo "Pushing images..."
        docker push "$FRONTEND_IMAGE" &
        docker push "$API_IMAGE" &
        wait

        echo "Both images pushed successfully"
        echo "Frontend → $FRONTEND_IMAGE"
        echo "API      → $API_IMAGE"
      displayName: 'Parallel Docker Build + Push'

    - bash: docker logout quay.io || true
      displayName: 'Logout'
      condition: always()

# ------------------------------------------------------------
# STAGE 4: DEPLOY (Minimal + Fast)
# ------------------------------------------------------------
- stage: Deploy
  displayName: 'Deploy to OpenShift'
  dependsOn: Docker
  condition: succeeded()
  jobs:
  - job: Deploy
    displayName: 'Kustomize Deploy'
    steps:
    - checkout: self
      fetchDepth: 1
      clean: false

    # Only copy the app folder (not whole openshift tree)
    - task: CopyFilesOverSSH@0
      displayName: 'Copy manifests'
      inputs:
        sshEndpoint: 'OpenShifSC'
        sourceFolder: '$(Build.SourcesDirectory)/openshift'
        contents: |
          bootstrap/**
          app/**
        targetFolder: '/tmp/eduadmin-$(Build.BuildId)'
        cleanTargetFolder: true
        overwrite: true

    - task: SSH@0
      displayName: 'Apply + Rollout'
      inputs:
        sshEndpoint: 'OpenShifSC'
        runOptions: inline
        inline: |
          set -euo pipefail

          PROJECT="$(openshiftProject)"
          MANIFEST="/tmp/eduadmin-$(Build.BuildId)"

          echo "=== OpenShift Login Check ==="
          oc whoami
          oc whoami --show-server

          echo "=== Ensure Project ==="
          oc apply -f "$MANIFEST/bootstrap/namespace.yaml"

          # Secret check (fail fast)
          if ! oc -n "$PROJECT" get secret studentapi-secret >/dev/null 2>&1; then
            echo "ERROR: studentapi-secret missing in $PROJECT"
            exit 1
          fi

          echo "=== Set image tag $(Build.BuildId) ==="
          sed -i "s/__IMAGE_TAG__/$(Build.BuildId)/g" "$MANIFEST/app/kustomization.yaml"

          echo "=== Apply Kustomize ==="
          oc apply -k "$MANIFEST/app/" -n "$PROJECT"

          echo "=== Wait for rollouts ==="
          oc rollout status deployment/studentapp -n "$PROJECT" --timeout=120s
          oc rollout status deployment/studentapi -n "$PROJECT" --timeout=120s

          echo "=== Final Status ==="
          oc get deploy,pods,svc,route -n "$PROJECT"

          # Cleanup old temp folder (optional)
          rm -rf "$MANIFEST"




