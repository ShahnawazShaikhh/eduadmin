trigger:
  - main

pool:
  name: Default

variables:
  buildConfiguration: Release
  frontendRepository: afiyamulla/studentapp
  backendRepository: afiyamulla/studentapi

steps:
  - checkout: self
    displayName: Checkout GitHub Repository

  - task: UseDotNet@2
    displayName: Install .NET 8 SDK
    inputs:
      packageType: sdk
      version: '8.0.x'

  - task: NodeTool@0
    displayName: Install Node.js 22
    inputs:
      versionSpec: '22.x'

  - script: |
      set -eu
      echo "===== VERIFY TOOLS ====="
      git --version
      dotnet --version
      node --version
      npm --version
      docker --version
      docker info
    displayName: Verify Build Environment

  - script: |
      set -eu
      API_DIR="$(Build.SourcesDirectory)/StudentAPI/StudentAPI/StudentAPI"
      PROJECT="$API_DIR/StudentAPI.csproj"

      test -f "$PROJECT"

      echo "===== RESTORE .NET DEPENDENCIES ====="
      dotnet restore "$PROJECT"

      echo "===== BUILD .NET API ====="
      dotnet build "$PROJECT" --configuration "$(buildConfiguration)" --no-restore
    displayName: Build StudentAPI

  - script: |
      set -eu
      FRONTEND_DIR="$(Build.SourcesDirectory)/student-app"

      test -f "$FRONTEND_DIR/package.json"
      test -f "$FRONTEND_DIR/package-lock.json"

      cd "$FRONTEND_DIR"

      echo "===== INSTALL ANGULAR DEPENDENCIES ====="
      npm ci

      echo "===== BUILD ANGULAR FRONTEND ====="
      npm run build
    displayName: Build StudentApp

  - task: Docker@2
    displayName: Build and Push StudentApp to Quay.io
    inputs:
      command: buildAndPush
      containerRegistry: QuaySC
      repository: $(frontendRepository)
      Dockerfile: $(Build.SourcesDirectory)/student-app/Dockerfile
      buildContext: $(Build.SourcesDirectory)/student-app
      tags: |
        $(Build.BuildId)

  - task: Docker@2
    displayName: Build and Push StudentAPI to Quay.io
    inputs:
      command: buildAndPush
      containerRegistry: QuaySC
      repository: $(backendRepository)
      Dockerfile: $(Build.SourcesDirectory)/StudentAPI/StudentAPI/StudentAPI/Dockerfile
      buildContext: $(Build.SourcesDirectory)/StudentAPI/StudentAPI/StudentAPI
      tags: |
        $(Build.BuildId)

  - script: |
      echo "======================================"
      echo "CI PIPELINE COMPLETED SUCCESSFULLY"
      echo "Frontend: quay.io/$(frontendRepository):$(Build.BuildId)"
      echo "Backend:  quay.io/$(backendRepository):$(Build.BuildId)"
      echo "======================================"
    displayName: Display Published Images