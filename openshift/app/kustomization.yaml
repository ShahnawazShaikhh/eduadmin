apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eduadmin-dev

commonLabels:
  app.kubernetes.io/part-of: eduadmin
  app.kubernetes.io/managed-by: kustomize

resources:
  - configmap.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - frontend-route.yaml
  - api-deployment.yaml
  - api-service.yaml

images:
  - name: quay.io/afiyamulla/studentapp
    newTag: "__IMAGE_TAG__"
  - name: quay.io/afiyamulla/studentapi
    newTag: "__IMAGE_TAG__"
